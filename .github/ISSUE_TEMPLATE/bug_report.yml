name: Bug report
description: Report a reproducible Kleari issue
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Do not include credentials, personal file contents, or sensitive paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kleari version or commit
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
